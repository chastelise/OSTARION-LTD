<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="300" height="300" fill="#FFFFFF"/>
  
  <!-- HMS Text -->
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#059669" text-anchor="middle" dominant-baseline="middle">HMS</text>
  
  <!-- Medical Cross -->
  <g transform="translate(150, 210)">
    <rect x="-8" y="-30" width="16" height="60" rx="3" fill="#10B981"/>
    <rect x="-30" y="-8" width="60" height="16" rx="3" fill="#10B981"/>
  </g>
  
  <!-- Heartbeat Line -->
  <path d="M 40 80 L 70 80 L 85 60 L 100 100 L 115 80 L 260 80" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Stethoscope Icon -->
  <circle cx="60" cy="200" r="8" fill="none" stroke="#10B981" stroke-width="3"/>
  <path d="M 60 192 Q 60 170 80 160" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Medical Shield -->
  <path d="M 240 190 L 240 220 Q 240 230 230 235 Q 220 240 210 235 Q 200 230 200 220 L 200 190 Z" fill="#10B981" opacity="0.3"/>
  <path d="M 215 200 L 215 215 M 207 207.5 L 223 207.5" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
</svg>
